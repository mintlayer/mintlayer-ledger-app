name: Run unit tests

# This workflow will run `run_unit_tests.sh` from the project root for each device model.

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:

jobs:
  run_extra_checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        model: [nanox, nanosp, stax, flex, apex_p]
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v5
    
      - name: Update the list of available system packages
        run: sudo apt-get update

      - name: Install build dependencies
        run: sudo apt-get install -yqq --no-install-recommends docker-ce

      - name: Run the checks
        run: |
          docker run --rm -v "$(realpath .):/app" -w /app \
            ghcr.io/ledgerhq/ledger-app-builder/ledger-app-dev-tools:latest \
            bash run_unit_tests.sh ${{ matrix.model }}
